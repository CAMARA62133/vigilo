<div class="min-h-screen bg-linear-to-br from-slate-50 to-white font-sans antialiased flex items-center justify-center p-4">
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-cyan-200/20 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-pink-200/20 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md text-center">
    <div class="inline-flex items-center justify-center w-20 h-20 rounded-3xl bg-white shadow-xl border border-slate-100 mb-8 relative group">
      <div class="absolute inset-0 bg-linear-to-br from-pink-500 to-rose-500 rounded-3xl opacity-10 group-hover:opacity-20 transition-opacity"></div>
      <i class="fa-solid fa-shield-slash text-3xl text-pink-600"></i>

      <span class="absolute -top-2 -right-2 flex h-6 w-6">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-pink-400 opacity-75"></span>
        <span class="relative inline-flex rounded-full h-6 w-6 bg-pink-500 items-center justify-center text-[10px] text-white font-bold">!</span>
      </span>
    </div>

    <h1 class="text-5xl font-black tracking-tighter text-slate-800 mb-4 uppercase italic">
      Accès <span class="text-transparent bg-clip-text bg-linear-to-r from-pink-600 to-rose-500">Refusé</span>
    </h1>

    <div class="bg-white/80 backdrop-blur-md rounded-2xl border border-slate-200/60 p-8 shadow-2xl shadow-slate-200/50">
      <p class="text-slate-500 text-sm leading-relaxed mb-8">
        Désolé, vos privilèges actuels ne vous permettent pas d'accéder à cette section de <strong>Vigilo</strong>.
        Si vous pensez qu'il s'agit d'une erreur, contactez votre administrateur système.
      </p>

      <div class="flex flex-col gap-3">
        <button (click)="goBack()"
          class="w-full py-3.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs uppercase tracking-widest transition-all active:scale-95 flex items-center justify-center gap-2 shadow-lg shadow-slate-900/20">
          <i class="fa-solid fa-arrow-left"></i>
          Retourner au Dashboard
        </button>

        <button (click)="logout()"
          class="w-full py-3.5 rounded-xl bg-white border border-slate-200 hover:bg-slate-50 text-slate-500 font-bold text-xs uppercase tracking-widest transition-all flex items-center justify-center gap-2">
          Se déconnecter
        </button>
      </div>
    </div>

    <p class="mt-8 text-[10px] text-slate-400 font-bold uppercase tracking-[0.3em]">
      Vigilo Administration &bull; Sécurité Système
    </p>
  </div>
</div>
