<div class="min-h-screen bg-linear-to-br from-slate-50 to-white font-sans antialiased flex items-center justify-center p-4">
  <div class="fixed inset-0 overflow-hidden pointer-events-none">
    <div class="absolute -top-40 -right-40 w-80 h-80 bg-cyan-200/30 rounded-full blur-3xl"></div>
    <div class="absolute -bottom-40 -left-40 w-80 h-80 bg-slate-200/30 rounded-full blur-3xl"></div>
  </div>

  <div class="relative w-full max-w-md text-center">
    <div class="relative mb-8">
      <h2 class="text-[120px] font-black leading-none tracking-tighter text-slate-100 select-none">
        404
      </h2>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-20 h-20 flex items-center justify-center rounded-2xl bg-white shadow-2xl border border-slate-100">
          <i class="fa-solid fa-compass-slash text-3xl text-cyan-500 animate-bounce"></i>
        </div>
      </div>
    </div>

    <h1 class="text-3xl font-black tracking-tight text-slate-800 mb-3 uppercase">
      Page <span class="text-cyan-600">Introuvable</span>
    </h1>

    <div class="bg-white/70 backdrop-blur-xl rounded-2xl border border-slate-200/50 p-6 shadow-xl mb-8">
      <p class="text-slate-500 text-sm leading-relaxed">
        Il semble que le chemin que vous cherchez n'existe pas ou a été déplacé.
        Vérifiez l'URL ou utilisez le bouton ci-dessous pour retrouver votre chemin.
      </p>
    </div>

    <div class="flex flex-col sm:flex-row gap-3 justify-center">
      <button (click)="goHome()"
        class="px-8 py-3 rounded-xl bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs uppercase tracking-widest transition-all shadow-lg shadow-cyan-600/20 active:scale-95 flex items-center justify-center gap-2">
        <i class="fa-solid fa-house"></i>
        Tableau de bord
      </button>

      <button (click)="goBack()"
        class="px-8 py-3 rounded-xl bg-white border border-slate-200 text-slate-600 font-bold text-xs uppercase tracking-widest transition-all hover:bg-slate-50 flex items-center justify-center gap-2">
        Retour
      </button>
    </div>

    <div class="mt-12 flex items-center justify-center gap-2">
      <div class="h-px w-8 bg-slate-200"></div>
      <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Vigilo Guard</p>
      <div class="h-px w-8 bg-slate-200"></div>
    </div>
  </div>
</div>
